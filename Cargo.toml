[package]
name = "mux"
version = "0.1.0"
edition = "2021"
description = "Minimal terminal multiplexer with sidebar tabs"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.29.0"
libc = "0.2"
portable-pty = "0.9.0"
vt100 = "0.16.2"
unicode-width = "0.2"
unicode-segmentation = "1.12"
signal-hook = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
