[package]
name = "polypty"
version = "0.1.0"
edition = "2021"
description = "Agent-aware terminal multiplexer with sidebar tabs and nested panes"
license = "MIT"
repository = "https://github.com/sqweeet/polypty"
homepage = "https://github.com/sqweeet/polypty"
documentation = "https://docs.rs/polypty"
readme = "README.md"
keywords = ["terminal", "multiplexer", "pty", "tui", "cli"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/.gitignore", "/journal.md", "/scripts"]
publish = ["crates-io"]

[dependencies]
anyhow = "1"
crossterm = "0.29.0"
libc = "0.2"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.16.2"
unicode-width = "0.2"
unicode-segmentation = "1.12"
signal-hook = "0.3"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = "0.25"

[profile.release]
lto = true
codegen-units = 1
strip = true
